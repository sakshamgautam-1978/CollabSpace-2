
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborations | CollabSpace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="collaborations">
    <div id="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <main class="main-content">
            <header class="topbar" id="topbar"></header>
            <section class="page-content">
                <div class="page-heading">
                    <div>
                        <p class="eyebrow">WORK BETTER TOGETHER</p>
                        <h1>Collaborations</h1>
                        <p>Manage incoming requests and your active teams.</p>
                    </div>
                </div>

                <section class="panel">
                    <div class="panel-header">
                        <h2>Incoming Requests</h2>
                    </div>
                    <div id="incomingRequests">
                        <p class="empty-state">Incoming collaboration requests will appear here.</p>
                    </div>
                </section>

                <section class="panel">
                    <div class="panel-header">
                        <h2>Sent Requests</h2>
                    </div>
                    <div id="sentRequests">
                        <p class="empty-state">Requests you send will appear here.</p>
                    </div>
                </section>

                <section class="panel">
                    <div class="panel-header">
                        <h2>Active Collaborations</h2>
                    </div>
                    <div id="activeCollaborations">
                        <p class="empty-state">Your accepted collaborations will appear here.</p>
                    </div>
                </section>
            </section>
        </main>
    </div>
    <script src="js/navigation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
