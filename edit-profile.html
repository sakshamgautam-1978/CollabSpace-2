
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | CollabSpace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="edit-profile">
    <div id="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <main class="main-content">
            <header class="topbar" id="topbar"></header>
            <section class="page-content">
                <div class="page-heading">
                    <div>
                        <p class="eyebrow">PERSONALISE YOUR PRESENCE</p>
                        <h1>Edit Profile</h1>
                        <p>Keep your creator profile up to date.</p>
                    </div>
                </div>

                <section class="panel form-panel">
                    <form id="editProfileForm">
                        <div class="form-group">
                            <label for="editName">Full Name</label>
                            <input type="text" id="editName" required maxlength="60">
                        </div>
                        <div class="form-group">
                            <label for="editHeadline">Professional Headline</label>
                            <input type="text" id="editHeadline" maxlength="100" placeholder="e.g. Frontend Developer and UI Designer">
                        </div>
                        <div class="form-group">
                            <label for="editLocation">Location</label>
                            <input type="text" id="editLocation" maxlength="100" placeholder="City, Country">
                        </div>
                        <div class="form-group">
                            <label for="editAbout">About Me</label>
                            <textarea id="editAbout" rows="5" maxlength="500" placeholder="Tell people about yourself..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="editSkills">Skills</label>
                            <input type="text" id="editSkills" placeholder="HTML, CSS, JavaScript">
                            <small>Separate skills with commas.</small>
                        </div>
                        <div class="form-group">
                            <label for="editPortfolio">Portfolio URL</label>
                            <input type="url" id="editPortfolio" placeholder="https://example.com">
                        </div>
                        <div class="form-group">
                            <label for="editAvailability">Availability</label>
                            <select id="editAvailability">
                                <option value="Available">Available for collaboration</option>
                                <option value="Busy">Currently busy</option>
                                <option value="Unavailable">Not available</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </form>
                </section>
            </section>
        </main>
    </div>
    <script src="js/navigation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
