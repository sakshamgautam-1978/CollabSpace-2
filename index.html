
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora |  Creator Collaboration Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page" data-page="auth">
    <main class="auth-container">
        <section class="auth-brand">
            <div class="brand-icon">N</div>
            <h1>Nexora</h1>
            <p>Great ideas happen when creative minds connect.</p>
            <div class="auth-decoration">✦</div>
        </section>

        <section class="auth-card">
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="showLogin">Log In</button>
                <button type="button" class="auth-tab" id="showSignup">Sign Up</button>
            </div>

            <form id="loginForm">
                <h2>Welcome back</h2>
                <p>Log in to continue collaborating.</p>
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Log In</button>
                <p class="auth-message" id="loginMessage" aria-live="polite"></p>
            </form>

            <form id="signupForm" hidden>
                <h2>Create your account</h2>
                <p>Join creators and build something amazing.</p>
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" required maxlength="60" placeholder="Your name">
                </div>
                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" required minlength="6" placeholder="At least 6 characters">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Create Account</button>
                <p class="auth-message" id="signupMessage" aria-live="polite"></p>
            </form>

           
            <p class="auth-note">Nexora · Creator Collaboration Platform</p>
        </section>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
