
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Project | CollabSpace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="post-project">
    <div id="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <main class="main-content">
            <header class="topbar" id="topbar"></header>
            <section class="page-content">
                <div class="page-heading">
                    <div>
                        <p class="eyebrow">START SOMETHING GREAT</p>
                        <h1>Post a Project</h1>
                        <p>Share your idea and find the right collaborators.</p>
                    </div>
                </div>

                <section class="panel form-panel">
                    <form id="postProjectForm">
                        <div class="form-group">
                            <label for="projectTitle">Project Title</label>
                            <input type="text" id="projectTitle" required maxlength="80" placeholder="e.g. AI-powered learning platform">
                        </div>

                        <div class="form-group">
                            <label for="projectDescription">Project Description</label>
                            <textarea id="projectDescription" rows="5" required maxlength="1500" placeholder="Describe your idea, goals and what you want to build..."></textarea>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="projectCategory">Category</label>
                                <select id="projectCategory" required>
                                    <option value="">Select category</option>
                                    <option>Technology</option>
                                    <option>Design</option>
                                    <option>Content</option>
                                    <option>Business</option>
                                    <option>Education</option>
                                    <option>Other</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="projectTeamSize">Team Size</label>
                                <input type="number" id="projectTeamSize" min="1" max="50" value="2" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="projectSkills">Required Skills</label>
                            <input type="text" id="projectSkills" required placeholder="HTML, CSS, JavaScript, UI Design">
                            <small>Separate skills with commas.</small>
                        </div>

                        <div class="form-group">
                            <label for="projectDeadline">Expected Deadline</label>
                            <input type="date" id="projectDeadline">
                        </div>

                        <button type="submit" class="btn btn-primary">Publish Project</button>
                    </form>
                </section>
            </section>
        </main>
    </div>
    <script src="js/navigation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
