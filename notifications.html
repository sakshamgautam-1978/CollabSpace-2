
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | CollabSpace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="notifications">
    <div id="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <main class="main-content">
            <header class="topbar" id="topbar"></header>
            <section class="page-content">
                <div class="page-heading">
                    <div>
                        <p class="eyebrow">WHAT'S NEW</p>
                        <h1>Notifications</h1>
                        <p>Stay updated with your latest activities.</p>
                    </div>
                    <button id="markAllRead" class="btn btn-secondary">Mark All as Read</button>
                </div>

                <section class="panel">
                    <div class="panel-header">
                        <h2>All Notifications</h2>
                        <span id="unreadCount">0 unread</span>
                    </div>
                    <div id="notificationList">
                        <p class="empty-state">You're all caught up!</p>
                    </div>
                </section>
            </section>
        </main>
    </div>
    <script src="js/navigation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
