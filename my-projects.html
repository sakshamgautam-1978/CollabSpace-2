
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects | CollabSpace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="my-projects">
    <div id="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <main class="main-content">
            <header class="topbar" id="topbar"></header>
            <section class="page-content">
                <div class="page-heading">
                    <div>
                        <p class="eyebrow">YOUR WORKSPACE</p>
                        <h1>My Projects</h1>
                        <p>Manage your projects and track their progress.</p>
                    </div>
                    <a href="post-project.html" class="btn btn-primary">+ New Project</a>
                </div>

                <div class="stats-grid">
                    <article class="stat-card">
                        <p>Total Posted</p>
                        <h2 id="myProjectCount">0</h2>
                    </article>
                    <article class="stat-card">
                        <p>Open Projects</p>
                        <h2 id="openProjectCount">0</h2>
                    </article>
                    <article class="stat-card">
                        <p>Join Requests</p>
                        <h2 id="projectRequestCount">0</h2>
                    </article>
                </div>

                <section class="panel">
                    <div class="panel-header">
                        <h2>My Project Listings</h2>
                    </div>
                    <div id="myProjectsList" class="project-grid">
                        <p class="empty-state">Your posted projects will appear here.</p>
                    </div>
                </section>
            </section>
        </main>
    </div>
    <script src="js/navigation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
