
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Creators | CollabSpace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="creators">
    <div id="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <main class="main-content">
            <header class="topbar" id="topbar"></header>
            <section class="page-content">
                <div class="page-heading">
                    <div>
                        <p class="eyebrow">BUILD YOUR NETWORK</p>
                        <h1>Discover Creators</h1>
                        <p>Find talented people and build your next team.</p>
                    </div>
                </div>

                <section class="panel">
                    <div class="search-filter-row">
                        <input type="search" id="creatorSearch" placeholder="Search by name or skill...">
                        <select id="creatorSkillFilter">
                            <option value="">All Skills</option>
                            <option value="Web Development">Web Development</option>
                            <option value="UI/UX Design">UI/UX Design</option>
                            <option value="Graphic Design">Graphic Design</option>
                            <option value="Video Editing">Video Editing</option>
                            <option value="Content Writing">Content Writing</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Data Science">Data Science</option>
                        </select>
                    </div>
                </section>

                <div id="creatorGrid" class="creator-grid">
                    <p class="empty-state">Creators will appear here.</p>
                </div>
            </section>
        </main>
    </div>
    <script src="js/navigation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
